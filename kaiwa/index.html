      html.auth-pending body { visibility: hidden; }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#F0F6FF" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DORA KAIWA" />
    <link rel="manifest" href='data:application/manifest+json;utf-8,{"name":"DORA KAIWA","short_name":"DORA KAIWA","start_url":"/","display":"standalone","background_color":"%23F0F6FF","theme_color":"%23F0F6FF","icons":[{"src":"/images/dora-logo.png","sizes":"32x32","type":"image/png"},{"src":"/images/dora-logo.png","sizes":"256x256","type":"image/png","purpose":"any"}]}' />

    <link rel="icon" type="image/png" href="/images/dora-logo.png" />
    <link rel="apple-touch-icon" href="/images/dora-logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://doranihongo.com/" />
    <meta property="og:title" content="DORA KAIWA" />
    <meta property="og:image" content="https://doranihongo.com/images/dora-logo.png" />
    <meta property="og:site_name" content="DORA KAIWA" />

    <style>
      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: auto !important;
        -khtml-user-select: auto !important;
        -moz-user-select: auto !important;
        -ms-user-select: auto !important;
        user-select: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script defer src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/js/supabaseClient.js"></script>
    <script defer src="/js/utils.js"></script>
    <script defer src="/js/common.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Chặn chuột phải
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Chặn kéo thả
      document.addEventListener('dragstart', function(e) {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
        }
      });

      // Chặn copy
      document.addEventListener('copy', function(e) {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
          return;
        }
        e.preventDefault();
      });

      // Chặn phím tắt
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
        }
        
        if (e.ctrlKey || e.metaKey) {
          if (e.key === 'u' || e.key === 'U' || e.keyCode === 85) {
            e.preventDefault(); // Ctrl + U
          }
          if (e.key === 's' || e.key === 'S' || e.keyCode === 83) {
            e.preventDefault(); // Ctrl + S
          }
          if (e.key === 'p' || e.key === 'P' || e.keyCode === 80) {
            // Cho phép in nếu muốn, nhưng yêu cầu chặn Ctrl+P.
            e.preventDefault(); // Ctrl + P
          }
          if (e.shiftKey) {
            if (e.key === 'i' || e.key === 'I' || e.keyCode === 73 || 
                e.key === 'c' || e.key === 'C' || e.keyCode === 67 || 
                e.key === 'j' || e.key === 'J' || e.keyCode === 74) {
              e.preventDefault(); // DevTools
            }
          }
        }
      });
    </script>
  </body>
</html>
