<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - DORA ONLINE</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="shortcut icon" href="/images/dora-logo.png" />
    <link rel="apple-touch-icon" href="/images/dora-logo.png" />

    <!-- PWA: cho phép "Thêm vào màn hình chính" ngay từ trang login - đây
         là trang đầu tiên người chưa đăng nhập gặp trên di động, cần đủ
         thẻ này thì trình duyệt mới coi là cài được (apple-touch-icon ở
         trên phải là PNG, không phải SVG - iOS không render SVG làm touch
         icon đáng tin cậy). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F0F6FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DORA ONLINE" />

    <!-- StyleSheet - _tokens.css chỉ còn cấp vòng focus bàn phím + tắt hoạt ảnh
         khi người dùng bật "giảm chuyển động"; màu/kiểu dáng sáng của trang
         nằm hết trong login.css -->
    <link rel="stylesheet" href="/css/_tokens.css" />
    <link rel="stylesheet" href="/css/login.css" />

    <!-- Supabase JS SDK -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- Hiện khi đang kiểm tra phiên đăng nhập cũ lúc tải trang -->
    <div id="loginLoading" class="login-loading">
      <div class="login-spinner" aria-hidden="true"></div>
      <p>Đang kiểm tra phiên đăng nhập...</p>
    </div>

    <!-- Giao diện sáng giống trang đăng nhập của web Phá Đảo Tiếng Nhật: thẻ trắng
         bo lớn giữa màn hình, logo + tiêu đề, ô nhập có icon, nút xanh #2F7DF6.
         Cùng 1 thẻ có 2 màn (login.js đổi class state-login / state-changepw):
         "Đăng nhập" và "Đổi mật khẩu" (bắt buộc lần đầu đăng nhập). -->
    <main id="authCard" class="auth-card hidden state-login">
      <img class="auth-logo" src="/logo-dora.webp" alt="DORA" />

      <!-- Màn đăng nhập -->
      <div class="auth-panel" data-panel="login">
        <h1>Đăng nhập</h1>
        <p class="auth-sub">Đăng nhập để vào phòng học trực tuyến DORA ONLINE.</p>

        <form id="loginForm" novalidate>
          <div class="auth-field">
            <label for="loginUsername">Tài khoản</label>
            <div class="auth-input-wrap">
              <input
                id="loginUsername"
                type="text"
                autocomplete="off"
                placeholder="Nhập tài khoản"
                required
              />
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            </div>
          </div>
          <div class="auth-field auth-field-password">
            <label for="loginPassword">Mật khẩu</label>
            <div class="auth-input-wrap">
              <input
                id="loginPassword"
                type="password"
                autocomplete="off"
                placeholder="••••••••"
                required
              />
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
              <button
                type="button"
                class="auth-toggle-password"
                data-target="loginPassword"
                aria-label="Hiện mật khẩu"
              ></button>
            </div>
          </div>
          <button id="loginSubmitBtn" type="submit" class="auth-submit">
            ĐĂNG NHẬP
          </button>
        </form>

        <div id="loginError" class="auth-error" role="alert"></div>
      </div>

      <!-- Màn đổi mật khẩu bắt buộc lần đầu -->
      <div class="auth-panel" data-panel="changepw">
        <h1>Đổi mật khẩu</h1>
        <p class="auth-sub">Gần xong rồi! Đổi mật khẩu là vào được luôn!</p>

        <form id="changePasswordForm" novalidate>
          <div class="auth-field auth-field-password">
            <label for="newPassword">Mật khẩu mới</label>
            <div class="auth-input-wrap">
              <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Mật khẩu mới"
                required
              />
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
              <button
                type="button"
                class="auth-toggle-password"
                data-target="newPassword"
                aria-label="Hiện mật khẩu"
              ></button>
            </div>
          </div>
          <div class="auth-field auth-field-password">
            <label for="confirmPassword">Nhập lại mật khẩu mới</label>
            <div class="auth-input-wrap">
              <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Nhập lại mật khẩu mới"
                required
              />
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
              <button
                type="button"
                class="auth-toggle-password"
                data-target="confirmPassword"
                aria-label="Hiện mật khẩu"
              ></button>
            </div>
          </div>
          <button
            id="changePasswordSubmitBtn"
            type="submit"
            class="auth-submit"
          >
            XÁC NHẬN
          </button>
        </form>

        <div id="changePasswordError" class="auth-error" role="alert"></div>
      </div>
    </main>

    <script defer src="/js/supabaseClient.js"></script>
    <script defer src="/js/login.js"></script>
    <script>
      // Đăng ký service worker để trang này cũng "cài được" (Add to
      // Home Screen) trên di động - không load chung common.js vì
      // authGuard trong đó sẽ redirect ngay trên chính trang login.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register((window.SITE_BASE || "/") + "sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
